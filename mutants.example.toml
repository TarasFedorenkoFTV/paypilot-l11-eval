# Список мутантів L11 (крок 2 лабораторної).
#
# 1. Скопіюйте цей файл у mutants.toml.
# 2. Впишіть 12 мутантів, по три на кожен клас:
#      значення тіру · межа EUR 1 000 · арифметика · форма результату
#    Поле class пишіть саме так, дослівно: "значення тіру", "межа EUR 1 000",
#    "арифметика", "форма результату" — скрипт групує мутантів за цим рядком.
# 3. Закомітьте mutants.toml ДО першого прогону:
#      git add mutants.toml && git commit -m "L11: список мутантів"
#    (Windows PowerShell: git add mutants.toml; git commit -m "L11: список мутантів")
#    Після цього список не змінюється.
#
# Кожен мутант — одна маленька зміна в коді:
#   id       — A-01…A-03, B-01…B-03, C-01…C-03, D-01…D-03
#   class    — назва класу
#   file     — файл, у якому міняємо (app/engines/fx.py або app/engines/policy.py)
#   find     — рядок коду дослівно, як у файлі (з пробілами); має зустрічатися рівно 1 раз
#   replace  — на що міняємо
#   description — що зламано, людською мовою
#
# Якщо в рядку є лапки, беріть інші лапки навколо: find = '"tier2": 0.9'
# Перевірка, що список застосовується: python tools/run_mutants.py --check

[[mutant]]
id = "A-01"
class = "значення тіру"
file = "app/engines/policy.py"
find = '"tier2": 0.9'
replace = '"tier2": 1.5'
description = "клієнт tier2 платить 1.5 % замість 0.9 % (наслідок як у дефекту D20)"

